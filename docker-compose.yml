services:
  mongo:
    image: mongo:7
    container_name: campus-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-campusadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-ChangeMe12345}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-smartcampus}
    volumes:
      - mongo-data:/data/db
    ports:
      - "127.0.0.1:27017:27017"   # local access only (e.g. MongoDB Compass)
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [campus-net]

  app:
    build: .
    image: smart-campus-complaints:2.0
    container_name: campus-app
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 3000
      MONGO_URI: mongodb://${MONGO_USER:-campusadmin}:${MONGO_PASSWORD:-ChangeMe12345}@mongo:27017/${MONGO_DB:-smartcampus}?authSource=admin
    ports:
      - "${APP_PORT:-8080}:3000"
    networks: [campus-net]

  # Optional database browser: docker compose --profile tools up -d
  mongo-express:
    image: mongo-express:1.0.2
    container_name: campus-mongo-express
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER:-campusadmin}:${MONGO_PASSWORD:-ChangeMe12345}@mongo:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_PASSWORD:-ChangeMe12345}
    ports:
      - "127.0.0.1:8081:8081"
    networks: [campus-net]

networks:
  campus-net:

volumes:
  mongo-data:
